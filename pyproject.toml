[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelstudio"
version = "2.0.0"
description = "Script -> voice-over -> scenes -> reel, rendered with Remotion"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
reelstudio = "reelstudio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/reelstudio/providers/fake.py" = ["E501"]
"src/reelstudio/providers/gemini/script.py" = ["E501"]
"src/reelstudio/providers/gemini/story.py" = ["E501"]
"src/reelstudio/production/*" = ["E501"]
